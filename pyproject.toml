[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "logprob-engine"
version = "0.1.0"
description = "A simple single-GPU HTTP server for computing token-level log-probabilities with a Hugging Face causal LM."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "logprob-engine contributors" }]
keywords = ["llm", "logprobs", "transformers", "inference", "server"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.2",
    "transformers>=4.40",
    "numpy>=1.24",
    "tqdm",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2",
    "requests>=2.28",
]

[project.optional-dependencies]
test = ["pytest>=7", "httpx>=0.27"]

[project.scripts]
logprob-engine = "logprob_engine.cli:main"

[project.urls]
Repository = "https://github.com/yunjae-won/logprob-engine"

[tool.setuptools.packages.find]
include = ["logprob_engine*"]
exclude = ["tests*", "examples*"]
